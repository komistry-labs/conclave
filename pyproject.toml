[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "conclave"
version = "0.8.0"
description = "Multi-provider AI coordination and governance CLI for Komistry OS"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]

[project.scripts]
conclave = "conclave.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/conclave"]

[tool.hatch.build.targets.wheel.force-include]
"policies/idm-reference-pin.json" = "conclave/policies/idm-reference-pin.json"

[tool.hatch.build.targets.sdist]
include = [
    "/src/conclave",
    "/policies/idm-reference-pin.json",
    "/pyproject.toml",
    "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

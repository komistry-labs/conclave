name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -r tests/fixtures/idm-baseline/requirements.lock
          python -m pip install --no-deps tests/fixtures/idm-baseline/idm_reference-0.1.0.dev0-py3-none-any.whl
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest --junitxml=pytest-report.xml
      - name: Build exact packages
        run: python -m build --sdist --wheel --outdir dist
      - name: Inventory and scan packages
        run: >-
          python tools/conformance_evidence.py --root . --dist dist
          --junit pytest-report.xml --output conformance-evidence
          --platform-id ${{ matrix.os }}-py${{ matrix.python-version }}
      - name: Probe installed wheel in clean environment
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          wheel = next(Path("dist").glob("*.whl"))
          subprocess.run([sys.executable, "tools/installed_wheel_probe.py",
                          "--wheel", str(wheel), "--output",
                          "conformance-evidence/installed-wheel-probe.json"], check=True)
      - name: Publish secret-free conformance evidence
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            pytest-report.xml
            conformance-evidence/
          if-no-files-found: error
